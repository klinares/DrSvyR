<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="t d" font-family="Lato, 'Segoe UI', system-ui, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">The TRAPD model for translating questionnaires</title>
<desc id="d">Five steps: translation, review, adjudication, pretesting and documentation. QuestionR can produce a first draft translation only; review by fluent speakers, deciding disagreements, testing with respondents and documenting the decisions are done by people.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b8a8b"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="249" rx="12" fill="#ffffff" stroke="#dee2e6"/>
<rect x="30" y="60" width="160" height="120" rx="10" fill="#e8f8f5" stroke="#18bc9c" stroke-width="2"/>
<circle cx="110" cy="88" r="17" fill="#18bc9c"/><text x="110" y="94" text-anchor="middle" font-size="16px" font-weight="700" fill="#ffffff">T</text>
<text x="110" y="128" text-anchor="middle" font-size="15px" font-weight="700" fill="#2c3e50">Translation</text>
<text x="110" y="150" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#2c3e50">Draft translations</text>
<rect x="225" y="60" width="160" height="120" rx="10" fill="#2c3e50"/>
<circle cx="305" cy="88" r="17" fill="#18bc9c"/><text x="305" y="94" text-anchor="middle" font-size="16px" font-weight="700" fill="#ffffff">R</text>
<text x="305" y="128" text-anchor="middle" font-size="15px" font-weight="700" fill="#ffffff">Review</text>
<text x="305" y="150" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#ffffff">Compare the drafts</text>
<text x="305" y="166" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#ffffff">with reviewers</text>
<rect x="420" y="60" width="160" height="120" rx="10" fill="#2c3e50"/>
<circle cx="500" cy="88" r="17" fill="#18bc9c"/><text x="500" y="94" text-anchor="middle" font-size="16px" font-weight="700" fill="#ffffff">A</text>
<text x="500" y="128" text-anchor="middle" font-size="15px" font-weight="700" fill="#ffffff">Adjudication</text>
<text x="500" y="150" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#ffffff">Decide where</text>
<text x="500" y="166" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#ffffff">they disagree</text>
<rect x="615" y="60" width="160" height="120" rx="10" fill="#2c3e50"/>
<circle cx="695" cy="88" r="17" fill="#18bc9c"/><text x="695" y="94" text-anchor="middle" font-size="16px" font-weight="700" fill="#ffffff">P</text>
<text x="695" y="128" text-anchor="middle" font-size="15px" font-weight="700" fill="#ffffff">Pretesting</text>
<text x="695" y="150" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#ffffff">Test with</text>
<text x="695" y="166" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#ffffff">respondents</text>
<rect x="810" y="60" width="160" height="120" rx="10" fill="#2c3e50"/>
<circle cx="890" cy="88" r="17" fill="#18bc9c"/><text x="890" y="94" text-anchor="middle" font-size="16px" font-weight="700" fill="#ffffff">D</text>
<text x="890" y="128" text-anchor="middle" font-size="15px" font-weight="700" fill="#ffffff">Documentation</text>
<text x="890" y="150" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#ffffff">Record what was</text>
<text x="890" y="166" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#ffffff">decided and why</text>
<line x1="192" y1="120" x2="223" y2="120" stroke="#7b8a8b" stroke-width="2" marker-end="url(#a)"/>
<line x1="387" y1="120" x2="418" y2="120" stroke="#7b8a8b" stroke-width="2" marker-end="url(#a)"/>
<line x1="582" y1="120" x2="613" y2="120" stroke="#7b8a8b" stroke-width="2" marker-end="url(#a)"/>
<line x1="777" y1="120" x2="808" y2="120" stroke="#7b8a8b" stroke-width="2" marker-end="url(#a)"/>
<path d="M110,190 L110,204" stroke="#18bc9c" stroke-width="2"/>
<text x="110" y="222" text-anchor="middle" font-size="12.5px" font-weight="700" fill="#0f8f75">QuestionR: a first draft only</text>
<path d="M305,190 L305,200 L890,200 L890,190" fill="none" stroke="#2c3e50" stroke-width="2"/>
<text x="597" y="222" text-anchor="middle" font-size="12.5px" font-weight="700" fill="#2c3e50">Done by people: fluent speakers, an adjudicator, real respondents</text>
<text x="500" y="36" text-anchor="middle" font-size="14px" font-weight="700" fill="#2c3e50">Translating a questionnaire: the TRAPD model</text>
<text x="985" y="240" text-anchor="end" font-size="11px" font-weight="400" fill="#5a6a6b" font-style="italic">Yan, IASS/WSS Session 2; Haensch, IASS/WSS Session 3</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
