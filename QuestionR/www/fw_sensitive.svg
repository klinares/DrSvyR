<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="t d" font-family="Lato, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title id="t">What makes a survey question sensitive?</title>
<desc id="d">Three reasons a question is sensitive: it is intrusive or out of bounds for ordinary conversations; it threatens or risks disclosing certain information to the survey organization or a third party; or it invokes social desirability concerns. Some questions are sensitive for more than one reason. Sensitivity is not a stable characteristic of a question: it varies by where and how the question is asked, who answers it, culture and time.</desc>
<rect x="0.5" y="0.5" width="999" height="439" rx="12" fill="#ffffff" stroke="#dee2e6"/>
<text x="500" y="30" text-anchor="middle" font-size="15px" font-weight="700" fill="#2c3e50">What makes a survey question sensitive?</text>

<g>
<rect x="30" y="50" width="300" height="230" rx="10" fill="#2c3e50"/>
<rect x="350" y="50" width="300" height="230" rx="10" fill="#2c3e50"/>
<rect x="670" y="50" width="300" height="230" rx="10" fill="#2c3e50"/>
</g>
<g font-size="14px" font-weight="700" fill="#ffffff" text-anchor="middle">
<text x="180" y="82">Intrusive or out of bounds</text>
<text x="180" y="102">for ordinary conversations</text>
<text x="500" y="82">Threats or risks of disclosing</text>
<text x="500" y="102">certain information (to survey</text>
<text x="500" y="122">organization or third party)</text>
<text x="820" y="82">Invoking social desirability</text>
<text x="820" y="102">concerns</text>
</g>
<g font-size="12.5px" fill="#ffffff" text-anchor="middle">
<text x="180" y="150">e.g., Sexual behaviors and conceptive</text>
<text x="180" y="168">use (NSFG)</text>
<text x="180" y="196">Risks offending all</text>
<text x="500" y="160">e.g., citizenship status;</text>
<text x="500" y="178">social security number</text>
<text x="820" y="140">Socially desirable behaviors/attitudes</text>
<text x="820" y="158">(e.g., voting) and socially undesirable</text>
<text x="820" y="176">behaviors/attitudes (e.g., driving under</text>
<text x="820" y="194">influence of alcohol)</text>
<text x="820" y="222">Sensitive only to those with</text>
<text x="820" y="240">undesirable behaviors/attitudes</text>
</g>

<rect x="30" y="300" width="300" height="110" rx="10" fill="#e8f8f5" stroke="#18bc9c" stroke-width="2"/>
<g font-size="13px" fill="#2c3e50" text-anchor="middle">
<text x="180" y="334" font-weight="700">Some sensitive questions are</text>
<text x="180" y="352" font-weight="700">sensitive for more than one reason</text>
<text x="180" y="382" font-size="12.5px">e.g., criminal justice involvement; drug use</text>
</g>

<rect x="350" y="300" width="620" height="110" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
<text x="660" y="328" text-anchor="middle" font-size="13px" font-weight="700" fill="#2c3e50">Sensitivity is not a stable characteristic of survey questions and varies by</text>
<g fill="#ffffff" stroke="#18bc9c" stroke-width="2">
<rect x="368" y="346" width="136" height="48" rx="8"/>
<rect x="516" y="346" width="136" height="48" rx="8"/>
<rect x="664" y="346" width="136" height="48" rx="8"/>
<rect x="812" y="346" width="140" height="48" rx="8"/>
</g>
<g font-size="12.5px" fill="#2c3e50" text-anchor="middle">
<text x="436" y="366">where and how</text><text x="436" y="383">questions are asked</text>
<text x="584" y="375">who answers it</text>
<text x="732" y="375">culture</text>
<text x="882" y="375">time</text>
</g>
<text x="985" y="430" text-anchor="end" font-size="11px" font-weight="400" fill="#5a6a6b" font-style="italic">Tourangeau and Yan (2007); Yan (2021)</text>
</svg>
