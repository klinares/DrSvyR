<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-labelledby="t d" font-family="Lato, 'Segoe UI', system-ui, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Methods for testing survey questions, and where AI fits</title>
<desc id="d">Three classes of methods. Expert methods are quick and inexpensive but involve no actual respondents; an AI model can act as an expert reviewer, which is where QuestionR sits. Lab-based methods involve actual respondents but are expensive; AI can simulate a respondent, with limits. Field-based methods collect large amounts of data from actual participants but are resource heavy; AI is no substitute for real respondents.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b8a8b"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="289" rx="12" fill="#ffffff" stroke="#dee2e6"/>
<rect x="30" y="50" width="300" height="120" rx="10" fill="#2c3e50"/>
<text x="180" y="80" text-anchor="middle" font-size="16px" font-weight="700" fill="#ffffff">Expert methods</text>
<text x="180" y="102" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#ffffff">Expert review, appraisal systems</text>
<text x="180" y="130" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#ffffff">Quick and inexpensive;</text>
<text x="180" y="148" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#ffffff">no actual respondents</text>
<line x1="180" y1="172" x2="180" y2="196" stroke="#7b8a8b" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="198" width="300" height="52" rx="10" fill="#e8f8f5" stroke="#18bc9c" stroke-width="2"/>
<text x="180" y="229" text-anchor="middle" font-size="13px" font-weight="700" fill="#2c3e50">AI as expert reviewer</text>
<rect x="350" y="50" width="300" height="120" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
<text x="500" y="80" text-anchor="middle" font-size="16px" font-weight="700" fill="#2c3e50">Lab-based methods</text>
<text x="500" y="102" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#5a6a6b">Focus groups, cognitive interviews</text>
<text x="500" y="130" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#5a6a6b">Actual respondents;</text>
<text x="500" y="148" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#5a6a6b">expensive</text>
<line x1="500" y1="172" x2="500" y2="196" stroke="#7b8a8b" stroke-width="2" marker-end="url(#a)"/>
<rect x="350" y="198" width="300" height="52" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
<text x="500" y="220" text-anchor="middle" font-size="13px" font-weight="400" fill="#5a6a6b">AI as simulated respondent,</text>
<text x="500" y="238" text-anchor="middle" font-size="13px" font-weight="400" fill="#5a6a6b">with limits</text>
<rect x="670" y="50" width="300" height="120" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
<text x="820" y="80" text-anchor="middle" font-size="16px" font-weight="700" fill="#2c3e50">Field-based methods</text>
<text x="820" y="102" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#5a6a6b">Web probing, debriefing, experiments</text>
<text x="820" y="130" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#5a6a6b">Large data from actual</text>
<text x="820" y="148" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#5a6a6b">participants; resource heavy</text>
<line x1="820" y1="172" x2="820" y2="196" stroke="#7b8a8b" stroke-width="2" marker-end="url(#a)"/>
<rect x="670" y="198" width="300" height="52" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
<text x="820" y="220" text-anchor="middle" font-size="13px" font-weight="400" fill="#5a6a6b">No substitute for</text>
<text x="820" y="238" text-anchor="middle" font-size="13px" font-weight="400" fill="#5a6a6b">real respondents</text>
<rect x="96" y="256" width="168" height="22" rx="11" fill="#18bc9c"/>
<text x="180" y="271" text-anchor="middle" font-size="12.5px" font-weight="700" fill="#ffffff">QuestionR is here</text>
<text x="500" y="32" text-anchor="middle" font-size="14px" font-weight="700" fill="#2c3e50">Testing survey questions: three classes of methods</text>
<text x="985" y="280" text-anchor="end" font-size="11px" font-weight="400" fill="#5a6a6b" font-style="italic">Yan, IASS/WSS Session 2; Haensch, IASS/WSS Session 3</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
