<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t d" font-family="Lato, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title id="t">Survey response process</title>
<desc id="d">The survey response model: comprehension, retrieval, judgment or estimation, and reporting, in that order. Below and above the four stages, arrows mark the undesirable response behaviors that lead to response error: skipping from comprehension or from retrieval straight to reporting, and going back from retrieval to comprehension, from judgment to retrieval and from reporting to judgment.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b8a8b"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="999" height="329" rx="12" fill="#ffffff" stroke="#dee2e6"/>
<text x="500" y="28" text-anchor="middle" font-size="15px" font-weight="700" fill="#2c3e50">Survey response process</text>

<g fill="#2c3e50">
<rect x="30" y="120" width="190" height="90" rx="10"/>
<rect x="280" y="120" width="190" height="90" rx="10"/>
<rect x="530" y="120" width="190" height="90" rx="10"/>
<rect x="780" y="120" width="190" height="90" rx="10"/>
</g>
<g font-size="15.5px" font-weight="700" fill="#ffffff" text-anchor="middle">
<text x="125" y="171">Comprehension</text>
<text x="375" y="171">Retrieval</text>
<text x="625" y="171">Judgment/estimation</text>
<text x="875" y="171">Reporting</text>
</g>
<g stroke="#7b8a8b" stroke-width="2.5" fill="none">
<line x1="224" y1="165" x2="276" y2="165" marker-end="url(#a)"/>
<line x1="474" y1="165" x2="526" y2="165" marker-end="url(#a)"/>
<line x1="724" y1="165" x2="776" y2="165" marker-end="url(#a)"/>
</g>

<g stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="7 4">
<path d="M125,116 C125,48 875,48 875,114" marker-end="url(#b)"/>
<path d="M375,116 C375,76 875,76 875,114" marker-end="url(#b)"/>
<path d="M330,214 C340,262 270,262 160,214" marker-end="url(#b)"/>
<path d="M580,214 C590,262 520,262 410,214" marker-end="url(#b)"/>
<path d="M830,214 C840,262 770,262 660,214" marker-end="url(#b)"/>
</g>
<text x="500" y="306" text-anchor="middle" font-size="13px" font-weight="700" fill="#c0392b">Undesirable response behaviors leading to response error</text>
<text x="985" y="318" text-anchor="end" font-size="11px" font-weight="400" fill="#5a6a6b" font-style="italic">Survey Response Model (Tourangeau, Rips, and Rasinski, 2000)</text>
</svg>
