<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="t d" font-family="Lato, 'Segoe UI', system-ui, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">The survey response model</title>
<desc id="d">Four stages a respondent goes through to answer a question: comprehension, retrieval, judgment or estimation, and reporting. A question can fail at any stage.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b8a8b"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="219" rx="12" fill="#ffffff" stroke="#dee2e6"/>
<rect x="30" y="60" width="190" height="100" rx="10" fill="#e8f8f5" stroke="#18bc9c" stroke-width="2"/>
<text x="125" y="102" text-anchor="middle" font-size="15.5px" font-weight="700" fill="#2c3e50">Comprehension</text>
<text x="125" y="128" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#2c3e50">Understand the question</text>
<rect x="280" y="60" width="190" height="100" rx="10" fill="#e8f8f5" stroke="#18bc9c" stroke-width="2"/>
<text x="375" y="102" text-anchor="middle" font-size="15.5px" font-weight="700" fill="#2c3e50">Retrieval</text>
<text x="375" y="128" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#2c3e50">Recall what is needed</text>
<rect x="530" y="60" width="190" height="100" rx="10" fill="#e8f8f5" stroke="#18bc9c" stroke-width="2"/>
<text x="625" y="102" text-anchor="middle" font-size="15.5px" font-weight="700" fill="#2c3e50">Judgment / estimation</text>
<text x="625" y="128" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#2c3e50">Form an answer</text>
<rect x="780" y="60" width="190" height="100" rx="10" fill="#e8f8f5" stroke="#18bc9c" stroke-width="2"/>
<text x="875" y="102" text-anchor="middle" font-size="15.5px" font-weight="700" fill="#2c3e50">Reporting</text>
<text x="875" y="128" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#2c3e50">Fit it to the answer options</text>
<line x1="222" y1="110" x2="278" y2="110" stroke="#7b8a8b" stroke-width="2" marker-end="url(#a)"/>
<line x1="472" y1="110" x2="528" y2="110" stroke="#7b8a8b" stroke-width="2" marker-end="url(#a)"/>
<line x1="722" y1="110" x2="778" y2="110" stroke="#7b8a8b" stroke-width="2" marker-end="url(#a)"/>
<text x="500" y="36" text-anchor="middle" font-size="14px" font-weight="700" fill="#2c3e50">How a respondent answers a question</text>
<text x="500" y="188" text-anchor="middle" font-size="13px" font-weight="400" fill="#5a6a6b">A question can fail at any stage. Every rule in QuestionR protects one of them.</text>
<text x="985" y="208" text-anchor="end" font-size="11px" font-weight="400" fill="#5a6a6b" font-style="italic">Tourangeau, Rips and Rasinski (2000)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
