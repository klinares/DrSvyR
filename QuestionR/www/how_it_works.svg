<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" role="img" aria-labelledby="t d" font-family="Lato, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title id="t">How QuestionR works</title>
<desc id="d">Four steps. The analyst pastes questions or describes a construct. The AI reviewer applies the reflexes. The analyst reads the bottom line and fixes. The analyst copies into Word.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="199" rx="12" fill="#ffffff" stroke="#dee2e6"/>
<g stroke-width="2">
<rect x="25" y="50" width="200" height="100" rx="10" fill="#f8f9fa" stroke="#ced4da"/>
<rect x="275" y="50" width="200" height="100" rx="10" fill="#e8f8f5" stroke="#18bc9c"/>
<rect x="525" y="50" width="200" height="100" rx="10" fill="#f8f9fa" stroke="#ced4da"/>
<rect x="775" y="50" width="200" height="100" rx="10" fill="#f8f9fa" stroke="#ced4da"/>
</g>
<g stroke="#2c3e50" stroke-width="2" fill="none">
<line x1="227" y1="100" x2="271" y2="100" marker-end="url(#a)"/>
<line x1="477" y1="100" x2="521" y2="100" marker-end="url(#a)"/>
<line x1="727" y1="100" x2="771" y2="100" marker-end="url(#a)"/>
</g>
<g font-size="12px" font-weight="700" fill="#5a6a6b" text-anchor="middle">
<text x="125" y="40">Analyst</text>
<text x="375" y="40">AI reviewer</text>
<text x="625" y="40">Analyst</text>
<text x="875" y="40">Analyst</text>
</g>
<g font-size="14px" fill="#2c3e50" text-anchor="middle">
<text x="125" y="95">Pastes questions,</text>
<text x="125" y="115">or describes a construct</text>
<text x="375" y="95">Applies</text>
<text x="375" y="115">the reflexes</text>
<text x="625" y="95">Reads the bottom line</text>
<text x="625" y="115">and fixes</text>
<text x="875" y="95">Copies</text>
<text x="875" y="115">into Word</text>
</g>
</svg>
