<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" aria-labelledby="t d" font-family="Lato, 'Segoe UI', system-ui, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">How QuestionR works</title>
  <desc id="d">Six steps. The analyst describes what is needed and checks the instructions. Several AI models draft at the same time, and a reviewing model checks the drafts against the rules and recommends one set. The analyst decides, editing any question, and copies the result into Word with a record of how it was made. Written survey design rules, the reflexes, steer the instructions, the drafts and the review. If the result is not right, change the brief and run again.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8a8b"/>
    </marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#18bc9c"/>
    </marker>
    <style>
      .you  { fill: #2c3e50; }
      .ai   { fill: #e8f8f5; stroke: #18bc9c; stroke-width: 2; }
      .num  { font-size: 13px; font-weight: 700; }
      .ttl  { font-size: 16px; font-weight: 700; }
      .cap  { font-size: 12.5px; }
      .who  { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; }
      .w    { fill: #ffffff; }
      .d    { fill: #2c3e50; }
      .flow { stroke: #7b8a8b; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Its own background, so it reads the same in light and dark mode. -->
  <rect x="0.5" y="0.5" width="999" height="309" rx="12" fill="#ffffff" stroke="#dee2e6"/>

  <!-- Who does each step -->
  <g class="who">
    <text x="85"  y="30" text-anchor="middle" fill="#2c3e50">ANALYST</text>
    <text x="250" y="30" text-anchor="middle" fill="#2c3e50">ANALYST</text>
    <text x="415" y="30" text-anchor="middle" fill="#0f8f75">AI MODELS</text>
    <text x="580" y="30" text-anchor="middle" fill="#0f8f75">AI REVIEWER</text>
    <text x="745" y="30" text-anchor="middle" fill="#2c3e50">ANALYST</text>
    <text x="910" y="30" text-anchor="middle" fill="#2c3e50">ANALYST</text>
  </g>

  <!-- 1. Describe -->
  <rect class="you" x="20" y="40" width="130" height="130" rx="10"/>
  <circle cx="40" cy="60" r="11" fill="#18bc9c"/><text class="num w" x="40" y="64.5" text-anchor="middle">1</text>
  <text class="ttl w" x="85" y="98"  text-anchor="middle">Describe</text>
  <text class="ttl w" x="85" y="117" text-anchor="middle">what you need</text>
  <text class="cap w" x="85" y="141" text-anchor="middle">Question, country,</text>
  <text class="cap w" x="85" y="157" text-anchor="middle">mode, language</text>

  <!-- 2. Check -->
  <rect class="you" x="185" y="40" width="130" height="130" rx="10"/>
  <circle cx="205" cy="60" r="11" fill="#18bc9c"/><text class="num w" x="205" y="64.5" text-anchor="middle">2</text>
  <text class="ttl w" x="250" y="98"  text-anchor="middle">Check the</text>
  <text class="ttl w" x="250" y="117" text-anchor="middle">instructions</text>
  <text class="cap w" x="250" y="141" text-anchor="middle">See what is sent;</text>
  <text class="cap w" x="250" y="157" text-anchor="middle">approve or edit</text>

  <!-- 3. Draft -->
  <rect class="ai" x="350" y="40" width="130" height="130" rx="10"/>
  <circle cx="370" cy="60" r="11" fill="#18bc9c"/><text class="num w" x="370" y="64.5" text-anchor="middle">3</text>
  <text class="ttl d" x="415" y="98"  text-anchor="middle">Several</text>
  <text class="ttl d" x="415" y="117" text-anchor="middle">models draft</text>
  <text class="cap d" x="415" y="141" text-anchor="middle">All at the</text>
  <text class="cap d" x="415" y="157" text-anchor="middle">same time</text>

  <!-- 4. Review -->
  <rect class="ai" x="515" y="40" width="130" height="130" rx="10"/>
  <circle cx="535" cy="60" r="11" fill="#18bc9c"/><text class="num w" x="535" y="64.5" text-anchor="middle">4</text>
  <text class="ttl d" x="580" y="98"  text-anchor="middle">One model</text>
  <text class="ttl d" x="580" y="117" text-anchor="middle">reviews</text>
  <text class="cap d" x="580" y="141" text-anchor="middle">Checks every draft,</text>
  <text class="cap d" x="580" y="157" text-anchor="middle">recommends one set</text>

  <!-- 5. Decide -->
  <rect class="you" x="680" y="40" width="130" height="130" rx="10"/>
  <circle cx="700" cy="60" r="11" fill="#18bc9c"/><text class="num w" x="700" y="64.5" text-anchor="middle">5</text>
  <text class="ttl w" x="745" y="98"  text-anchor="middle">Analyst</text>
  <text class="ttl w" x="745" y="117" text-anchor="middle">decides</text>
  <text class="cap w" x="745" y="141" text-anchor="middle">Edit, remove or</text>
  <text class="cap w" x="745" y="157" text-anchor="middle">swap any question</text>

  <!-- 6. Word -->
  <rect class="you" x="845" y="40" width="130" height="130" rx="10"/>
  <circle cx="865" cy="60" r="11" fill="#18bc9c"/><text class="num w" x="865" y="64.5" text-anchor="middle">6</text>
  <text class="ttl w" x="910" y="98"  text-anchor="middle">Copy into</text>
  <text class="ttl w" x="910" y="117" text-anchor="middle">Word</text>
  <text class="cap w" x="910" y="141" text-anchor="middle">With a record of</text>
  <text class="cap w" x="910" y="157" text-anchor="middle">how it was made</text>

  <!-- Step to step -->
  <g class="flow" marker-end="url(#a)">
    <line x1="152" y1="105" x2="182" y2="105"/>
    <line x1="317" y1="105" x2="347" y2="105"/>
    <line x1="482" y1="105" x2="512" y2="105"/>
    <line x1="647" y1="105" x2="677" y2="105"/>
    <line x1="812" y1="105" x2="842" y2="105"/>
  </g>

  <!-- The reflexes steer steps 2 to 4 -->
  <g stroke="#18bc9c" stroke-width="2" fill="none" marker-end="url(#s)">
    <line x1="250" y1="200" x2="250" y2="174"/>
    <line x1="415" y1="200" x2="415" y2="174"/>
    <line x1="580" y1="200" x2="580" y2="174"/>
  </g>
  <rect x="185" y="200" width="460" height="42" rx="8" fill="#ffffff" stroke="#18bc9c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="415" y="226" text-anchor="middle" font-size="13.5px" fill="#2c3e50"><tspan font-weight="700">Reflexes:</tspan> written survey design rules steer every model</text>

  <!-- Try again -->
  <path class="flow" stroke-dasharray="5 4" marker-end="url(#a)" d="M745,172 L745,272 L85,272 L85,174"/>
  <rect x="255" y="262" width="320" height="20" fill="#ffffff"/>
  <text x="415" y="277" text-anchor="middle" font-size="12.5px" font-style="italic" fill="#5a6a6b">Not quite right? Change the brief and run again.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
