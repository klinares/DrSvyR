<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="t d" font-family="Lato, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title id="t">Total Survey Error (TSE) framework</title>
<desc id="d">Two columns that meet at the survey statistic. Measurement: construct, measurement, response and edited response, with validity, measurement error and processing error between them. Representation: target population, sampling frame, sample, respondents and postsurvey adjustments, with coverage error, sampling error, nonresponse error and adjustment error between them. Validity and measurement error are highlighted as the errors essential to questionnaire design.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
