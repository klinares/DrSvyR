<text x="330" y="62" text-anchor="middle" font-size="13px" font-weight="700" fill="#2c3e50">Measurement</text>
<line x1="270" y1="67" x2="390" y2="67" stroke="#2c3e50" stroke-width="1.2"/>
<text x="670" y="62" text-anchor="middle" font-size="13px" font-weight="700" fill="#2c3e50">Representation</text>
<line x1="600" y1="67" x2="740" y2="67" stroke="#2c3e50" stroke-width="1.2"/>

