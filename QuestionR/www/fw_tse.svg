<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="t d" font-family="Lato, 'Segoe UI', system-ui, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Total Survey Error: the measurement side</title>
<desc id="d">Four steps from what you want to measure to the data you analyse: the construct, the measurement (the question), the response, and the edited response. Between them are three kinds of error: validity, measurement error, and processing error. Questionnaire design works on the first two.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b8a8b"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="249" rx="12" fill="#ffffff" stroke="#dee2e6"/>
<rect x="30" y="70" width="190" height="90" rx="10" fill="#2c3e50"/>
<text x="125" y="108" text-anchor="middle" font-size="16px" font-weight="700" fill="#ffffff">Construct</text>
<text x="125" y="132" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#ffffff">what you want to know</text>
<rect x="280" y="70" width="190" height="90" rx="10" fill="#2c3e50"/>
<text x="375" y="108" text-anchor="middle" font-size="16px" font-weight="700" fill="#ffffff">Measurement</text>
<text x="375" y="132" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#ffffff">the question you ask</text>
<rect x="530" y="70" width="190" height="90" rx="10" fill="#2c3e50"/>
<text x="625" y="108" text-anchor="middle" font-size="16px" font-weight="700" fill="#ffffff">Response</text>
<text x="625" y="132" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#ffffff">the answer given</text>
<rect x="780" y="70" width="190" height="90" rx="10" fill="#2c3e50"/>
<text x="875" y="108" text-anchor="middle" font-size="16px" font-weight="700" fill="#ffffff">Edited response</text>
<text x="875" y="132" text-anchor="middle" font-size="12.5px" font-weight="400" fill="#ffffff">the data you analyse</text>
<line x1="222" y1="115" x2="278" y2="115" stroke="#7b8a8b" stroke-width="2" marker-end="url(#a)"/>
<text x="250.0" y="60" text-anchor="middle" font-size="12.5px" font-weight="700" fill="#0f8f75">Validity</text>
<line x1="250.0" y1="66" x2="250.0" y2="104" stroke="#ced4da" stroke-width="1.5"/>
<line x1="472" y1="115" x2="528" y2="115" stroke="#7b8a8b" stroke-width="2" marker-end="url(#a)"/>
<text x="500.0" y="60" text-anchor="middle" font-size="12.5px" font-weight="700" fill="#0f8f75">Measurement error</text>
<line x1="500.0" y1="66" x2="500.0" y2="104" stroke="#ced4da" stroke-width="1.5"/>
<line x1="722" y1="115" x2="778" y2="115" stroke="#7b8a8b" stroke-width="2" marker-end="url(#a)"/>
<text x="750.0" y="60" text-anchor="middle" font-size="12.5px" font-weight="700" fill="#5a6a6b">Processing error</text>
<line x1="750.0" y1="66" x2="750.0" y2="104" stroke="#ced4da" stroke-width="1.5"/>
<path d="M125,178 L125,192 L625,192 L625,178" fill="none" stroke="#18bc9c" stroke-width="2"/>
<text x="375" y="214" text-anchor="middle" font-size="13px" font-weight="700" fill="#0f8f75">Where questionnaire design reduces error</text>
<text x="500" y="30" text-anchor="middle" font-size="14px" font-weight="700" fill="#2c3e50">From the idea to the data: where a survey question can go wrong</text>
<text x="985" y="238" text-anchor="end" font-size="11px" font-weight="400" fill="#5a6a6b" font-style="italic">Adapted from Groves et al. (2009)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
