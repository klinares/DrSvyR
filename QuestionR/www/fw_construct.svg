<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="t d" font-family="Lato, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title id="t">From construct to question: decomposition and the errors on the way</title>
<desc id="d">Two parts. First, decomposition: from a theoretical construct, nonfatal victimization, through dimensions and sub-dimensions to indicators, moving from abstract, multidimensional concepts to specific, single-dimensioned domains. Second, errors from conceptualization to operationalization to analysis: in the theoretical world, theory, concepts and attributes, with specification errors between concepts and attributes; in the empirical world, question or questions, questionnaire, response and data file, with operationalization errors, measurement and non-response errors, and processing errors between them; the operational definition links attributes to questions, and the data file feeds back to theory.</desc>
