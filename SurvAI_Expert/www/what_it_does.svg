<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="wt wd" font-family="Lato, 'Segoe UI', system-ui, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title id="wt">What you can do with this tool</title>
<desc id="wd">Three things the tool does. Ask: put a question in plain words and get a short answer, the formula and R code to copy. Formulas: look up a formula and see what each symbol means, when it applies and how to compute it in R. Report reader: upload a survey's technical report and get how the sample and weights were built and what to do to analyze the data correctly.</desc>
<rect x="0.5" y="0.5" width="999" height="329" rx="12" fill="#ffffff" stroke="#dee2e6"/>

<!-- card 1: Ask -->
<rect x="24" y="24" width="300" height="282" rx="8" fill="#e8f8f5" stroke="#18bc9c" stroke-width="2"/>
<path d="M54,52 h62 a10,10 0 0 1 10,10 v26 a10,10 0 0 1 -10,10 h-34 l-14,13 v-13 h-14 a10,10 0 0 1 -10,-10 v-26 a10,10 0 0 1 10,-10 z" fill="#ffffff" stroke="#0f8f75" stroke-width="2.5" stroke-linejoin="round"/>
<text x="85" y="84" text-anchor="middle" font-size="26px" font-weight="700" fill="#0f8f75">?</text>
<text x="144" y="74" font-size="21px" font-weight="700" fill="#0f8f75">Ask</text>
<text x="144" y="97" font-size="13px" fill="#2c3e50">a question in plain words</text>
<line x1="44" y1="134" x2="304" y2="134" stroke="#18bc9c" stroke-width="1"/>
<text x="44" y="160" font-size="12px" font-weight="700" fill="#0f8f75" letter-spacing="0.6">YOU GET</text>
<g font-size="14px" fill="#2c3e50">
<circle cx="50" cy="183" r="3" fill="#0f8f75"/><text x="62" y="188">A short, direct answer</text>
<circle cx="50" cy="211" r="3" fill="#0f8f75"/><text x="62" y="216">The formula behind it</text>
<circle cx="50" cy="239" r="3" fill="#0f8f75"/><text x="62" y="244">R code you can copy and run</text>
<circle cx="50" cy="267" r="3" fill="#0f8f75"/><text x="62" y="272">What to check before you use it</text>
</g>

<!-- card 2: Formulas -->
<rect x="350" y="24" width="300" height="282" rx="8" fill="#eaf3fb" stroke="#3498db" stroke-width="2"/>
<rect x="370" y="52" width="72" height="59" rx="10" fill="#ffffff" stroke="#2a7ab8" stroke-width="2.5"/>
<text x="406" y="94" text-anchor="middle" font-size="34px" font-weight="700" fill="#2a7ab8">Σ</text>
<text x="460" y="74" font-size="21px" font-weight="700" fill="#2a7ab8">Formulas</text>
<text x="460" y="97" font-size="13px" fill="#2c3e50">look one up by name</text>
<line x1="370" y1="134" x2="630" y2="134" stroke="#3498db" stroke-width="1"/>
<text x="370" y="160" font-size="12px" font-weight="700" fill="#2a7ab8" letter-spacing="0.6">YOU GET</text>
<g font-size="14px" fill="#2c3e50">
<circle cx="376" cy="183" r="3" fill="#2a7ab8"/><text x="388" y="188">The formula, written out</text>
<circle cx="376" cy="211" r="3" fill="#2a7ab8"/><text x="388" y="216">What each symbol means</text>
<circle cx="376" cy="239" r="3" fill="#2a7ab8"/><text x="388" y="244">When it applies</text>
<circle cx="376" cy="267" r="3" fill="#2a7ab8"/><text x="388" y="272">How to compute it in R</text>
</g>

<!-- card 3: Report reader -->
<rect x="676" y="24" width="300" height="282" rx="8" fill="#f4f6f7" stroke="#2c3e50" stroke-width="2"/>
<path d="M704,48 h34 l16,16 v50 h-50 z" fill="#ffffff" stroke="#2c3e50" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M738,48 v16 h16" fill="none" stroke="#2c3e50" stroke-width="2.5" stroke-linejoin="round"/>
<g stroke="#2c3e50" stroke-width="2"><line x1="713" y1="78" x2="745" y2="78"/><line x1="713" y1="89" x2="745" y2="89"/><line x1="713" y1="100" x2="735" y2="100"/></g>
<text x="772" y="74" font-size="21px" font-weight="700" fill="#2c3e50">Report reader</text>
<text x="772" y="97" font-size="13px" fill="#2c3e50">upload a technical report</text>
<line x1="696" y1="134" x2="956" y2="134" stroke="#2c3e50" stroke-width="1"/>
<text x="696" y="160" font-size="12px" font-weight="700" fill="#2c3e50" letter-spacing="0.6">YOU GET</text>
<g font-size="14px" fill="#2c3e50">
<circle cx="702" cy="183" r="3" fill="#2c3e50"/><text x="714" y="188">How the sample was drawn</text>
<circle cx="702" cy="211" r="3" fill="#2c3e50"/><text x="714" y="216">How the weights were built</text>
<circle cx="702" cy="239" r="3" fill="#2c3e50"/><text x="714" y="244">How to analyze the data correctly</text>
<circle cx="702" cy="267" r="3" fill="#2c3e50"/><text x="714" y="272">What the report leaves out</text>
</g>
