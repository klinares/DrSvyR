<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="t d" font-family="Lato, 'Segoe UI', system-ui, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Total Survey Error (TSE) framework</title>
<desc id="d">Two columns that meet at the survey statistic, drawn with equal weight. The measurement side: construct, measurement, response and edited response, with validity, measurement error and processing error between them. The representation side: target population, sampling frame, sample, respondents and postsurvey adjustments, with coverage error, sampling error, nonresponse error and adjustment error between them.</desc>
